<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="ctc-t ctc-d">
  <title id="ctc-t">Contacto</title>
  <desc id="ctc-d">Correo juanmiguelruizsupe@gmail.com, sitio juanmiguelruiz.lat y ubicación Colombia</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.5s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .card { opacity: 0; animation: rise 0.3s ease forwards; }
    .icon { stroke: #E11D48; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <rect width="1000" height="270" fill="url(#bg)"/>
  <rect width="1000" height="270" fill="url(#grid)" opacity="0.35"/>

  <text x="60" y="66" class="sans rise" font-size="36" font-weight="700" fill="#e6edf3" style="animation-delay: 0s">Contacto</text>
  <rect x="60" y="82" width="64" height="3" rx="1.5" fill="url(#bar)" class="ln" style="animation-delay: 0.2s"/>

  <g class="card" style="animation-delay: 0.2s">
    <rect x="60" y="110" width="880" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <line x1="353.3" y1="134" x2="353.3" y2="216" stroke="#30363d"/>
    <line x1="646.7" y1="134" x2="646.7" y2="216" stroke="#30363d"/>

    <g transform="translate(191 138)" class="icon">
      <rect x="2" y="6" width="28" height="20" rx="3"/>
      <path d="M2 8 L16 18 L30 8"/>
    </g>
    <text x="207" y="200" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.3s forwards">juanmiguelruizsupe@gmail.com</text>

    <g transform="translate(484 138)" class="icon">
      <circle cx="16" cy="16" r="13"/>
      <ellipse cx="16" cy="16" rx="6" ry="13"/>
      <path d="M3 16 H29"/>
    </g>
    <text x="500" y="200" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.45s forwards">juanmiguelruiz.lat</text>

    <g transform="translate(777 138)" class="icon">
      <path d="M16 30 C16 30 6 19 6 12 A10 10 0 0 1 26 12 C26 19 16 30 16 30 Z"/>
      <circle cx="16" cy="12" r="4"/>
    </g>
    <text x="793" y="200" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.6s forwards">Colombia</text>
  </g>
</svg>
