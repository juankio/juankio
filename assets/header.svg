<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="hdr-t hdr-d">
  <title id="hdr-t">Juan Miguel Ruiz</title>
  <desc id="hdr-d">Fullstack Developer · Nuxt 3 · Vue · NestJS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="60" y="62" width="0" height="72">
        <animate attributeName="width" values="0;505" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" dur="0.6s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.35s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .blink { animation: blink 2s steps(1) infinite; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.35"/>

  <text x="60" y="112" class="sans" font-size="48" font-weight="700" fill="#e6edf3" textLength="500" lengthAdjust="spacingAndGlyphs" clip-path="url(#reveal)">Juan Miguel Ruiz</text>
  <rect x="60" y="130" width="0" height="3" rx="1.5" fill="#E11D48">
    <animate attributeName="width" values="0;90" dur="0.2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="60" y="180" class="sans rise" font-size="36" fill="#8b949e" style="animation-delay: 0.45s">Fullstack Developer</text>
  <text x="60" y="216" class="sans rise" font-size="36" fill="#8b949e" style="animation-delay: 0.45s">Nuxt 3 · Vue · NestJS</text>
  <text x="60" y="258" class="sans rise" font-size="36" fill="#6e7681" style="animation-delay: 0.6s">Tecnólogo en Desarrollo</text>
  <text x="60" y="294" class="sans rise" font-size="36" fill="#6e7681" style="animation-delay: 0.6s">de Software</text>

  <rect x="604" y="22" width="340" height="276" rx="12" fill="#161b22" stroke="#30363d"/>
  <line x1="604" y1="54" x2="944" y2="54" stroke="#30363d"/>
  <circle cx="626" cy="38" r="5" fill="#E11D48"/>
  <circle cx="644" cy="38" r="5" fill="#484f58"/>
  <circle cx="662" cy="38" r="5" fill="#484f58"/>
  <text x="624" y="90" class="mono ln" font-size="36" fill="#c9d1d9" style="animation-delay: 0.3s"><tspan fill="#E11D48">$</tspan> whoami</text>
  <text x="624" y="126" class="mono ln" font-size="36" fill="#c9d1d9" style="animation-delay: 0.36s">fullstack</text>
  <text x="624" y="162" class="mono ln" font-size="36" fill="#c9d1d9" style="animation-delay: 0.42s">developer</text>
  <text x="624" y="198" class="mono ln" font-size="32" fill="#c9d1d9" style="animation-delay: 0.48s"><tspan fill="#E11D48">$</tspan> ls ./proyectos</text>
  <text x="624" y="234" class="mono ln" font-size="36" fill="#c9d1d9" style="animation-delay: 0.54s">4 desplegados</text>
  <text x="624" y="270" class="mono ln" font-size="36" fill="#c9d1d9" style="animation-delay: 0.6s">ver abajo</text>
  <rect x="826" y="248" width="16" height="24" fill="#E11D48" class="blink" style="animation-delay: 0.9s"/>

  <path d="M0 312 Q125 296 250 312 T500 312 T750 312 T1000 312" pathLength="1" fill="none" stroke="url(#wave)" stroke-width="2" class="trace"/>
</svg>
