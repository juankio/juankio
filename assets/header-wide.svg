    .rise { opacity: 0; animation: rise 0.35s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .blink { animation: blink 2s steps(1) infinite; }
    .trace { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: trace 1s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
  </style>

