<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="stk-t stk-d">
  <title id="stk-t">Stack</title>
  <desc id="stk-d">Frontend: Vue, Nuxt, TypeScript, Tailwind. Backend: NestJS, MongoDB, Socket.io, Zod</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.5s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .card { opacity: 0; animation: rise 0.25s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <rect width="1000" height="400" fill="url(#bg)"/>
  <rect width="1000" height="400" fill="url(#grid)" opacity="0.35"/>

  <g class="rise" style="animation-delay: 0s">
    <text x="60" y="66" class="sans" font-size="36" font-weight="700" fill="#e6edf3">Stack</text>
  </g>
  <rect x="60" y="82" width="64" height="3" rx="1.5" fill="url(#bar)" class="ln" style="animation-delay: 0.2s"/>
  <text x="60" y="112" class="mono ln" font-size="13" fill="#6e7681" style="animation-delay: 0.2s">frontend · backend</text>

  <text x="60" y="150" class="mono ln" font-size="12" fill="#E11D48" style="animation-delay: 0.2s">FRONTEND</text>
  <text x="60" y="284" class="mono ln" font-size="12" fill="#E11D48" style="animation-delay: 0.2s">BACKEND</text>

  <g class="card" style="animation-delay: 0.25s">
    <rect x="60" y="162" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(80 186)" fill="none" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 2 H9 L18 17 L27 2 H36 L18 34 Z" fill="#4FC08D" stroke="none"/>
    </g>
    <text x="128" y="206" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Vue</text>
    <text x="128" y="226" class="mono" font-size="11" fill="#6e7681">UI reactiva</text>
  </g>

  <g class="card" style="animation-delay: 0.35s">
    <rect x="285" y="162" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(305 186)" fill="none" stroke="#00DC82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 32 L14 8 L21 20 L25 13 L34 32 Z"/>
    </g>
    <text x="353" y="206" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Nuxt</text>
    <text x="353" y="226" class="mono" font-size="11" fill="#6e7681">Framework SSR</text>
  </g>

  <g class="card" style="animation-delay: 0.45s">
    <rect x="510" y="162" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(530 186)">
      <rect width="36" height="36" rx="6" fill="#3178C6"/>
      <text x="18" y="25" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ffffff">TS</text>
    </g>
    <text x="578" y="206" class="sans" font-size="17" font-weight="600" fill="#e6edf3">TypeScript</text>
    <text x="578" y="226" class="mono" font-size="11" fill="#6e7681">Tipado estático</text>
  </g>

  <g class="card" style="animation-delay: 0.55s">
    <rect x="735" y="162" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(755 186)" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round">
      <path d="M2 12 Q7 4 13 12 Q18 20 24 12 M12 24 Q17 16 23 24 Q28 32 34 24"/>
    </g>
    <text x="803" y="206" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Tailwind</text>
    <text x="803" y="226" class="mono" font-size="11" fill="#6e7681">CSS utilitario</text>
  </g>

  <g class="card" style="animation-delay: 0.65s">
    <rect x="60" y="296" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(80 320)" fill="none" stroke="#E0234E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 2 L32 10 V26 L18 34 L4 26 V10 Z"/>
      <path d="M12 26 V10 L24 26 V10"/>
    </g>
    <text x="128" y="340" class="sans" font-size="17" font-weight="600" fill="#e6edf3">NestJS</text>
    <text x="128" y="360" class="mono" font-size="11" fill="#6e7681">APIs modulares</text>
  </g>

  <g class="card" style="animation-delay: 0.75s">
    <rect x="285" y="296" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(305 320)">
      <path d="M18 2 C24 10 26 16 22 26 L18 34 L14 26 C10 16 12 10 18 2 Z" fill="#47A248"/>
    </g>
    <text x="353" y="340" class="sans" font-size="17" font-weight="600" fill="#e6edf3">MongoDB</text>
    <text x="353" y="360" class="mono" font-size="11" fill="#6e7681">Base documental</text>
  </g>

  <g class="card" style="animation-delay: 0.85s">
    <rect x="510" y="296" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(530 320)" fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round">
      <circle cx="9" cy="18" r="6"/>
      <circle cx="27" cy="18" r="6"/>
      <path d="M15 18 H21"/>
    </g>
    <text x="578" y="340" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Socket.io</text>
    <text x="578" y="360" class="mono" font-size="11" fill="#6e7681">Tiempo real</text>
  </g>

  <g class="card" style="animation-delay: 0.95s">
    <rect x="735" y="296" width="205" height="84" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(755 320)" fill="none" stroke="#5B8DEF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6 H30 L6 30 H30"/>
    </g>
    <text x="803" y="340" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Zod</text>
    <text x="803" y="360" class="mono" font-size="11" fill="#6e7681">Validación</text>
  </g>
</svg>
