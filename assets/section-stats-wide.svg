<svg xmlns="http://www.w3.org/2000/svg" width="1537" height="170" viewBox="0 0 1537 170" role="img" aria-labelledby="sta-t sta-d">
  <title id="sta-t">GitHub Stats</title>
  <desc id="sta-d">Actividad pública de juankio en GitHub</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.5s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <rect width="1537" height="170" fill="url(#bg)"/>
  <rect width="1537" height="170" fill="url(#grid)" opacity="0.35"/>

  <text x="70" y="70" class="sans rise" font-size="38" font-weight="700" fill="#e6edf3" style="animation-delay: 0s">GitHub Stats</text>
  <rect x="70" y="86" width="150" height="6" rx="3" fill="url(#bar)" class="ln" style="animation-delay: 0.2s"/>
  <text x="70" y="132" class="mono ln" font-size="32" fill="#6e7681" style="animation-delay: 0.2s">actividad pública · juankio</text>
</svg>
