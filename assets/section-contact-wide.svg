<svg xmlns="http://www.w3.org/2000/svg" width="1537" height="440" viewBox="0 0 1537 440" role="img" aria-labelledby="ctc-t ctc-d">
  <title id="ctc-t">Contacto</title>
  <desc id="ctc-d">Correo juanmiguelruizsupe@gmail.com, sitio juanmiguelruiz.lat y ubicación Colombia</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.5s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .card { opacity: 0; animation: rise 0.3s ease forwards; }
    .icon { stroke: #E11D48; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <rect width="1537" height="440" fill="url(#bg)"/>
  <rect width="1537" height="440" fill="url(#grid)" opacity="0.35"/>

  <text x="70" y="76" class="sans rise" font-size="38" font-weight="700" fill="#e6edf3" style="animation-delay: 0s">Contacto</text>
  <rect x="70" y="94" width="160" height="6" rx="3" fill="url(#bar)" class="ln" style="animation-delay: 0.2s"/>

  <g class="card" style="animation-delay: 0.2s">
    <rect x="70" y="126" width="1397" height="290" rx="16" fill="#161b22" stroke="#30363d"/>
    <line x1="70" y1="222" x2="1467" y2="222" stroke="#30363d"/>
    <line x1="70" y1="319" x2="1467" y2="319" stroke="#30363d"/>

    <g transform="translate(118 156) scale(1.25)" class="icon">
      <rect x="2" y="6" width="28" height="20" rx="3"/>
      <path d="M2 8 L16 18 L30 8"/>
    </g>
    <text x="210" y="188" class="mono" font-size="32" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.3s forwards">juanmiguelruizsupe@gmail.com</text>

    <g transform="translate(118 253) scale(1.25)" class="icon">
      <circle cx="16" cy="16" r="13"/>
      <ellipse cx="16" cy="16" rx="6" ry="13"/>
      <path d="M3 16 H29"/>
    </g>
    <text x="210" y="285" class="mono" font-size="32" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.45s forwards">juanmiguelruiz.lat</text>

    <g transform="translate(118 350) scale(1.25)" class="icon">
      <path d="M16 30 C16 30 6 19 6 12 A10 10 0 0 1 26 12 C26 19 16 30 16 30 Z"/>
      <circle cx="16" cy="12" r="4"/>
    </g>
    <text x="210" y="382" class="mono" font-size="32" fill="#e6edf3" style="opacity: 0; animation: fadein 0.2s ease 0.6s forwards">Colombia</text>
  </g>
</svg>
