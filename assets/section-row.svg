<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="row-t row-d">
  <title id="row-t">Stack técnico y proyectos destacados</title>
  <desc id="row-d">Frontend: Vue, Nuxt, TypeScript, Tailwind. Backend: NestJS, MongoDB, Socket.io, Zod. Proyectos: Discord Party Hub, Cine al Parque, Contabilidad y Simulador ESP32</desc>
  <defs>
    
    <linearGradient id="bg-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar-s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-s" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  
    
    <linearGradient id="bg-p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar-p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-p" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise 0.5s ease forwards; }
    .ln { opacity: 0; animation: fadein 0.2s ease forwards; }
    .card { opacity: 0; animation: rise 0.3s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <g transform="translate(0 0)">

  <rect width="800" height="840" fill="url(#bg-s)"/>
  <rect width="800" height="840" fill="url(#grid-s)" opacity="0.35"/>

  <g class="rise" style="animation-delay: 0s">
    <text x="40" y="66" class="sans" font-size="38" font-weight="700" fill="#e6edf3">Stack</text>
  </g>
  <rect x="40" y="82" width="64" height="3" rx="1.5" fill="url(#bar-s)" class="ln" style="animation-delay: 0.2s"/>
  <text x="40" y="124" class="mono ln" font-size="36" fill="#6e7681" style="animation-delay: 0.2s">frontend · backend</text>

  <text x="40" y="176" class="mono ln" font-size="36" fill="#E11D48" style="animation-delay: 0.2s">FRONTEND</text>

  <g class="card" style="animation-delay: 0.2s">
    <rect x="40" y="196" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(64 218)" fill="none" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 2 H9 L18 17 L27 2 H36 L18 34 Z" fill="#4FC08D" stroke="none"/>
    </g>
    <text x="132" y="248" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Vue</text>
    <text x="64" y="302" class="mono" font-size="34" fill="#6e7681">UI reactiva</text>
  </g>

  <g class="card" style="animation-delay: 0.35s">
    <rect x="410" y="196" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(434 218)" fill="none" stroke="#00DC82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 32 L14 8 L21 20 L25 13 L34 32 Z"/>
    </g>
    <text x="502" y="248" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Nuxt</text>
    <text x="434" y="302" class="mono" font-size="34" fill="#6e7681">Framework SSR</text>
  </g>

  <g class="card" style="animation-delay: 0.45s">
    <rect x="40" y="342" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(64 364)">
      <rect width="52" height="40" rx="6" fill="#3178C6"/>
      <text x="26" y="32" text-anchor="middle" class="sans" font-size="36" font-weight="700" fill="#ffffff">TS</text>
    </g>
    <text x="132" y="394" class="sans" font-size="36" font-weight="600" fill="#e6edf3">TypeScript</text>
    <text x="64" y="448" class="mono" font-size="34" fill="#6e7681">Tipado estático</text>
  </g>

  <g class="card" style="animation-delay: 0.55s">
    <rect x="410" y="342" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(434 364)" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round">
      <path d="M2 12 Q7 4 13 12 Q18 20 24 12 M12 24 Q17 16 23 24 Q28 32 34 24"/>
    </g>
    <text x="502" y="394" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Tailwind</text>
    <text x="434" y="448" class="mono" font-size="34" fill="#6e7681">CSS utilitario</text>
  </g>

  <text x="40" y="516" class="mono ln" font-size="36" fill="#E11D48" style="animation-delay: 0.2s">BACKEND</text>

  <g class="card" style="animation-delay: 0.65s">
    <rect x="40" y="536" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(64 558)" fill="none" stroke="#E0234E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 2 L32 10 V26 L18 34 L4 26 V10 Z"/>
      <path d="M12 26 V10 L24 26 V10"/>
    </g>
    <text x="132" y="588" class="sans" font-size="36" font-weight="600" fill="#e6edf3">NestJS</text>
    <text x="64" y="642" class="mono" font-size="34" fill="#6e7681">APIs modulares</text>
  </g>

  <g class="card" style="animation-delay: 0.75s">
    <rect x="410" y="536" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(434 558)">
      <path d="M18 2 C24 10 26 16 22 26 L18 34 L14 26 C10 16 12 10 18 2 Z" fill="#47A248"/>
    </g>
    <text x="502" y="588" class="sans" font-size="36" font-weight="600" fill="#e6edf3">MongoDB</text>
    <text x="434" y="642" class="mono" font-size="34" fill="#6e7681">Base documental</text>
  </g>

  <g class="card" style="animation-delay: 0.85s">
    <rect x="40" y="682" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(64 704)" fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round">
      <circle cx="9" cy="18" r="6"/>
      <circle cx="27" cy="18" r="6"/>
      <path d="M15 18 H21"/>
    </g>
    <text x="132" y="734" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Socket.io</text>
    <text x="64" y="788" class="mono" font-size="34" fill="#6e7681">Tiempo real</text>
  </g>

  <g class="card" style="animation-delay: 0.95s">
    <rect x="410" y="682" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(434 704)" fill="none" stroke="#5B8DEF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6 H30 L6 30 H30"/>
    </g>
    <text x="502" y="734" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Zod</text>
    <text x="434" y="788" class="mono" font-size="34" fill="#6e7681">Validación</text>
  </g>
</g>
  <g transform="translate(800 0)">

  <rect width="800" height="840" fill="url(#bg-p)"/>
  <rect width="800" height="840" fill="url(#grid-p)" opacity="0.35"/>

  <text x="40" y="66" class="sans rise" font-size="38" font-weight="700" fill="#e6edf3" style="animation-delay: 0s">Proyectos destacados</text>
  <rect x="40" y="82" width="64" height="3" rx="1.5" fill="url(#bar-p)" class="ln" style="animation-delay: 0.2s"/>
  <text x="40" y="124" class="mono ln" font-size="36" fill="#6e7681" style="animation-delay: 0.2s">proyectos desplegados</text>

  <g class="card" style="animation-delay: 0.2s">
    <rect x="40" y="150" width="720" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="212" class="sans" font-size="36" font-weight="700" fill="#e6edf3">Discord Party Hub</text>
    <text x="64" y="266" class="sans" font-size="34" fill="#8b949e">Hub multijugador en tiempo real · UNO</text>
  </g>

  <g class="card" style="animation-delay: 0.35s">
    <rect x="40" y="320" width="720" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="382" class="sans" font-size="36" font-weight="700" fill="#e6edf3">Cine al Parque</text>
    <text x="64" y="436" class="sans" font-size="34" fill="#8b949e">Cartelera, asientos en vivo y reservas</text>
  </g>

  <g class="card" style="animation-delay: 0.5s">
    <rect x="40" y="490" width="720" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="552" class="sans" font-size="36" font-weight="700" fill="#e6edf3">Contabilidad</text>
    <text x="64" y="606" class="sans" font-size="34" fill="#8b949e">Registro y administración de finanzas</text>
  </g>

  <g class="card" style="animation-delay: 0.65s">
    <rect x="40" y="660" width="720" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="722" class="sans" font-size="36" font-weight="700" fill="#e6edf3">Simulador ESP32</text>
    <text x="64" y="776" class="sans" font-size="34" fill="#8b949e">Simulador interactivo de circuitos</text>
  </g>
</g>
</svg>
